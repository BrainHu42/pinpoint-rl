[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-search-env"
version = "0.1.0"
description = "An OSV-5M-to-Mapillary search-policy transfer environment"
requires-python = ">=3.11"
dependencies = ["mapbox-vector-tile>=2,<3", "numpy>=1.26,<3"]

[project.optional-dependencies]
real = ["Pillow>=10,<13", "opencv-python-headless>=4.8,<5"]
retrieval = ["Pillow>=10,<13", "torch>=2.1", "transformers>=4.40"]
feasibility = [
    "geographiclib>=2.1",
    "Pillow>=10,<13",
    "scipy>=1.11",
    "torch>=2.1",
    "transformers>=4.40",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
